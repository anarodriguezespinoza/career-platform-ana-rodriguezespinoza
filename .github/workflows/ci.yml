name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests e2e migrations
      - run: pytest
      - name: Compiled CSS is up to date
        run: ./scripts/build-css.sh && git diff --exit-code app/static/css/site.css
      - run: docker build -t career-platform .

  e2e:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:///./e2e.db
      COGNITO_ISSUER: ${{ vars.E2E_COGNITO_ISSUER }}
      COGNITO_CLIENT_ID: ${{ vars.E2E_COGNITO_CLIENT_ID }}
      COGNITO_ADMIN_EMAILS: ${{ secrets.E2E_ADMIN_EMAIL }}
      S3_SNAPSHOT_BUCKET: e2e-snapshots
      SES_FROM_EMAIL: e2e@example.com
      SES_TO_EMAIL: e2e@example.com
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: e2e-access-key
      AWS_SECRET_ACCESS_KEY: e2e-secret-key
      AWS_EC2_METADATA_DISABLED: true
      AWS_MAX_ATTEMPTS: 1
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_FALLBACK_BASE_URL: ${{ vars.E2E_FALLBACK_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[e2e]"
      - run: alembic upgrade head
      - run: python -m app.seed
      - run: playwright install --with-deps chromium
      - run: pytest e2e

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci --prefix infra
      - run: npm run build --prefix infra
      - run: npm test --prefix infra
      - run: cd infra && npx cdk synth -c environment=development -c sesFromEmail=ci@example.com
      - run: cd infra && npx cdk synth -c environment=production -c sesFromEmail=ci@example.com
