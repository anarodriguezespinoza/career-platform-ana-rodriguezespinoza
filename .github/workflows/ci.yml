name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix infra
      - run: npm run build --prefix infra
      - run: npm test --prefix infra -- tests/infra/cdk-synth.test.ts
      - run: npx --prefix infra cdk synth -c environment=development -c sesFromEmail=ci@example.com
      - run: npx --prefix infra cdk synth -c environment=production -c sesFromEmail=ci@example.com
