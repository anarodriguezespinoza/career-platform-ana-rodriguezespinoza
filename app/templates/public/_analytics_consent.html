<div id="analytics-consent" hidden role="region" aria-label="Analytics choice" class="fixed inset-x-0 bottom-0 z-50 border-t border-[var(--line)] bg-[var(--paper)]">
  <div class="page-shell flex flex-col gap-4 py-5 text-sm text-[var(--muted)] sm:flex-row sm:items-center sm:justify-between">
    <p class="max-w-2xl leading-6">May I use Google Analytics to count page views and clicks on links to other sites? It sets cookies and sends visit details to Google. Nothing loads unless you accept. <a class="text-[var(--accent)] underline underline-offset-4" href="/privacy">Privacy details</a>.
      <span data-consent-gpc hidden> Your browser sends a Global Privacy Control signal, so analytics stays off.</span></p>
    <div class="flex shrink-0 gap-3">
      <button type="button" class="button-secondary" data-consent-decline>Decline</button>
      <button type="button" class="button-primary" data-consent-accept>Accept</button>
    </div>
  </div>
</div>
