<article class="flex h-full flex-col border border-[var(--line)] bg-white p-6 shadow-[0_10px_30px_rgba(31,41,51,0.04)] transition-transform hover:-translate-y-1">
  <div class="mb-6 flex items-start justify-between gap-4">
    <span class="eyebrow">Project</span>
    <span class="font-mono text-xs text-[var(--muted)]">{{ (project.display_order + 1) | two_digit }}</span>
  </div>
  <h3 class="font-serif text-2xl font-semibold text-[var(--ink)]"><a href="/projects/{{ project.slug }}" class="hover:text-[var(--accent)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[var(--accent)]">{{ project.name }}</a></h3>
  <p class="mt-3 flex-1 leading-7 text-[var(--muted)]">{{ project.description }}</p>
  <div class="mt-6 flex flex-wrap gap-2">
    {% for technology in project.technologies %}<span class="tag">{{ technology.technology }}</span>{% endfor %}
  </div>
</article>
