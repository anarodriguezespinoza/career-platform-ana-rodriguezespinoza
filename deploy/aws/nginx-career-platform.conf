# Nginx site for the career platform on the AWS EC2 instance.
# Installed at /etc/nginx/sites-available/career-platform, linked into sites-enabled/.
# certbot (guide §10) adds the HTTPS server block and the HTTP-to-HTTPS redirect to this file.
server {
    server_name aws.anarodriguezespinoza.com anarodriguezespinoza.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aws.anarodriguezespinoza.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aws.anarodriguezespinoza.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

server {
    if ($host = anarodriguezespinoza.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aws.anarodriguezespinoza.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name aws.anarodriguezespinoza.com anarodriguezespinoza.com;
    return 404; # managed by Certbot




}